<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Índice dos projetos de programação front-end.">
    <title>Projetos | Programação Front-end</title>
    <link rel="icon" href="tecboard/favicon-tecboard-roxo.svg" type="image/svg+xml">
    <style>
        @font-face {
            font-family: "Poppins";
            src: url("tecboard/fonts/Poppins-Bold.ttf") format("truetype");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Roboto";
            src: url("tecboard/fonts/Roboto-Bold.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 48px 24px;
            background: #0E1014;
            color: #ffffff;
            font-family: "Roboto", Arial, sans-serif;
        }

        main {
            width: min(100%, 900px);
            margin: 0 auto;
        }

        .brand {
            display: block;
            width: 150px;
            height: auto;
            margin-bottom: 64px;
        }

        h1 {
            margin: 0;
            font-family: "Poppins", sans-serif;
            font-size: clamp(2.5rem, 7vw, 4rem);
            line-height: 1.15;
        }

        h1 span {
            color: #9747FF;
        }

        .intro {
            max-width: 620px;
            margin: 20px 0 40px;
            color: #c8c8d0;
            font-size: 1.125rem;
            line-height: 1.6;
        }

        .project-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr));
            gap: 20px;
            padding: 0;
            list-style: none;
        }

        .project-link {
            display: flex;
            min-height: 150px;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            border: 1px solid #34313c;
            border-radius: 16px;
            background: #17191f;
            color: inherit;
            text-decoration: none;
            transition: border-color 160ms ease, transform 160ms ease;
        }

        .project-link:hover {
            transform: translateY(-3px);
            border-color: #9747FF;
        }

        .project-link:focus-visible {
            outline: 3px solid #ffffff;
            outline-offset: 4px;
        }

        .project-link h2 {
            margin: 0 0 10px;
            color: #ffffff;
            font-family: "Poppins", sans-serif;
            font-size: 1.5rem;
        }

        .project-link p {
            margin: 0;
            color: #c8c8d0;
            line-height: 1.5;
        }

        .open-project {
            margin-top: 20px;
            color: #b985ff;
            font-weight: 700;
        }

        .note {
            margin-top: 28px;
            color: #92929c;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            body {
                padding: 32px 20px;
            }

            .brand {
                width: 125px;
                margin-bottom: 48px;
            }
        }
    </style>
</head>
<body>
    <main>
        <img class="brand" src="tecboard/img/logo-tecboard-branco.png" alt="Tecboard">

        <header>
            <h1><span>Projetos</span> front-end</h1>
            <p class="intro">Acesse os projetos desenvolvidos nos laboratórios de programação front-end.</p>
        </header>

        <nav aria-label="Projetos disponíveis">
            <ul class="project-list">
                <li>
                    <a class="project-link" href="tecboard/">
                        <div>
                            <h2>Tecboard</h2>
                            <p>Landing page de monitoramento com alertas inteligentes.</p>
                        </div>
                        <span class="open-project">Abrir projeto <span aria-hidden="true">↗</span></span>
                    </a>
                </li>
                <!-- Adicione novos projetos como itens <li> com links para suas subpastas. -->
            </ul>
        </nav>

        <p class="note">Novos projetos podem ser adicionados à lista apontando para o index.html de cada subpasta.</p>
    </main>
</body>
</html>
